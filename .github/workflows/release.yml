name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Artifacts
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/etikket-gate-scanner-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab release-assets/etikket-gate-scanner-${{ github.ref_name }}.aab

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: eTikket Gate Scanner ${{ github.ref_name }}
          files: |
            release-assets/etikket-gate-scanner-${{ github.ref_name }}.apk
            release-assets/etikket-gate-scanner-${{ github.ref_name }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
