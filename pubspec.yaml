name: etikket
description: "eTikket Gate Staff QR Code Scanner App for Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.4
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAFAFA"
  image: "assets/images/splashicon.png"
  android: true
  ios: false
  android_12:
    image: "assets/images/splashicon.png"
    color: "#FAFAFA"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
